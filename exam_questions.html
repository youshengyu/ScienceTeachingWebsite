<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>各校段考題 - 國高中數理化教學網站</title>
    <link rel="stylesheet" href="style.css"> <style>
        /* 延用您之前的樣式設定 */
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        .content { padding: 20px; max-width: 1000px; margin: auto; }
        
        /* 白色框框容器樣式 */
        .pdf-section {
            background-color: white;
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        h2.section-title { border-bottom: 2px solid #333; padding-bottom: 10px; }
        
        /* 學校連結列表樣式 */
        .school-list {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        .school-list li a {
            color: #007bff;
            text-decoration: none;
            font-size: 1.1em;
        }
        .school-list li a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="content">
        <h2 class="section-title">各校段考題資源彙整</h2>

        <div class="pdf-section">
            <h3>高中歷屆試題</h3>
            <ul class="school-list">
                <li><a href="https://www.google.com" target="_blank">建國中學</a></li>
                <li><a href="#" target="_blank">北一女中</a></li>
                <li><a href="#" target="_blank">師大附中</a></li>
                <li><a href="#" target="_blank">成功高中</a></li>
                <li><a href="#" target="_blank">中山女高</a></li>
            </ul>
        </div>

        <div class="pdf-section">
            <h3>國中歷屆試題</h3>
            <ul class="school-list">
                <li><a href="#" target="_blank">中正國中</a></li>
                <li><a href="#" target="_blank">敦化國中</a></li>
                <li><a href="#" target="_blank">金華國中</a></li>
            </ul>
        </div>

        <div class="pdf-section">
            <h3>國小歷屆試題</h3>
            <ul class="school-list">
                <li><a href="#" target="_blank">某某國小</a></li>
            </ul>
        </div>
    </div>

    <script>
        async function loadNavbar() {
            try {
                const response = await fetch('navbar.html');
                const html = await response.text();
                document.getElementById('navbar-container').innerHTML = html;
                markCurrentPage();
            } catch (error) { console.error('載入失敗:', error); }
        }

        function markCurrentPage() {
            const path = window.location.pathname.split('/').pop();
            const links = document.querySelectorAll('nav a');
            links.forEach(link => {
                if (link.getAttribute('href') === path) {
                    link.style.color = '#cc0000';
                    link.style.fontWeight = 'bold';
                }
            });
        }
        loadNavbar();
    </script>
</body>
</html>
