<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國中理化資源 | 國高中數理化教學網</title>
    <style>
        /* 1. 基礎佈局與背景色 */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4; /* 淺灰色底色 */
        }

        .content {
            padding: 20px 0;
            max-width: 1500px; /* 統一寬度 1500px */
            margin: 0 auto;
        }

        /* 2. 白色框框容器樣式 (卡片感) */
        .content-section {
            background-color: white;
            border: 1px solid #ddd;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: block !important;
        }

        /* 3. 標題樣式修改 */
        .section-title {
            border-bottom: 3px solid #333; /* 大標題底線 */
            padding-bottom: 10px;
            margin-top: 0;
            color: #2c3e50;
        }

        /* PDF 區塊的小標題：文字黑色，左側保留紅線樣式 */
        .pdf-section h3 {
            color: #333; 
            border-left: 5px solid #cc0000;
            padding-left: 10px;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .pdf-section {
            margin-top: 20px;
        }

        footer {
            margin-top: 30px;
            padding: 20px;
            color: #666;
        }
    </style>

    <script>
    window.MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']] 
        },
        svg: {
            fontCache: 'global'
        }
    };
    </script>
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
</head>
<body>

    <div id="navbar-container"></div>

    <div class="content">
        <div id="juniorpc" class="content-section">
            <h2 class="section-title">國中理化資源</h2>
            <p style="color: #666;">這裡是國中理化課程介紹、連結或 PDF 的地方。</p>
            
            <div class="pdf-section">
                <h3>國中理化公式、重點總整理</h3>
                <embed src="國中理化公式、重點總整理.pdf" type="application/pdf" width="100%" height="800px" title="國中理化公式、重點總整理">
            </div>
            
            <hr style="margin: 30px 0; border: 0; border-top: 1px dashed #ccc;">
        </div>
    </div>

    <footer>
        <p style="text-align: center;">&copy; 2025 數理化教學網</p>
    </footer>

    <script>
        async function loadNavbar() {
            try {
                // 讀取外部的 navbar.html
                const response = await fetch('navbar.html');
                const html = await response.text();
                document.getElementById('navbar-container').innerHTML = html;
                
                // 執行標記紅字的功能
                markCurrentPage();
            } catch (error) {
                console.error('導航列載入失敗:', error);
            }
        }

        function markCurrentPage() {
            // 取得目前檔案名稱 (例如: junior_pc.html)
            const path = window.location.pathname.split('/').pop() || 'index.html';
            const links = document.querySelectorAll('nav a');
            
            links.forEach(link => {
                const href = link.getAttribute('href');
                if (href === path) {
                    // 設定紅字加粗樣式
                    link.style.color = '#cc0000';
                    link.style.fontWeight = 'bold';
                    link.style.borderBottom = '2px solid #cc0000';
                }
            });
        }

        // 頁面載入完成後啟動
        window.onload = loadNavbar;
    </script>

</body>
</html>
